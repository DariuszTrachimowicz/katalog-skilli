# Konfiguracja nginx dla katalogu.
# Skopiuj do /etc/nginx/sites-available/katalog i podmień DOMENA na swoją.
# Certyfikat SSL dokłada certbot — patrz serwer/instalacja.sh.

server {
    listen 80;
    listen [::]:80;
    server_name DOMENA www.DOMENA;

    # Certbot podmieni to na przekierowanie do HTTPS po wydaniu certyfikatu.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://DOMENA$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.DOMENA;

    ssl_certificate     /etc/letsencrypt/live/DOMENA/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENA/privkey.pem;

    # Jeden kanoniczny adres — inaczej Google widzi dwie kopie tej samej strony.
    return 301 https://DOMENA$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMENA;

    root /var/www/katalog;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/DOMENA/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENA/privkey.pem;

    # Nagłówki bezpieczeństwa. Serwis nie ma logowania ani danych wrażliwych
    # po stronie przeglądarki, więc polityka może być wąska.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy   "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 512;

    # Usługa zapisów. Nasłuchuje tylko na localhost — z zewnątrz dostępna
    # wyłącznie tą drogą, więc limity i walidacja mają jeden punkt wejścia.
    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        client_max_body_size 16k;
    }

    # Pliki do pobrania — wymuszamy zapis na dysk zamiast otwierania w oknie.
    location /pobierz/ {
        types { }
        default_type application/zip;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /styl.css { add_header Cache-Control "public, max-age=604800"; }
    location = /robots.txt { access_log off; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    # Adresy bez końcowego ukośnika kierujemy na wersję z ukośnikiem,
    # żeby nie mnożyć wariantów tej samej podstrony.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
