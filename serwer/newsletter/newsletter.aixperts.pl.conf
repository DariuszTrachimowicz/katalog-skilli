server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name newsletter.aixperts.pl;
    ssl_certificate_key /etc/nginx/ssl-certificates/newsletter.aixperts.pl.key;
    ssl_certificate /etc/nginx/ssl-certificates/newsletter.aixperts.pl.crt;
    root /home/newsletter/htdocs/newsletter.aixperts.pl;
    charset utf-8;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16k;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag noindex always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    if ($scheme != "https") { return 308 https://newsletter.aixperts.pl$request_uri; }
    location ^~ /.well-known/acme-challenge/ { auth_basic off; allow all; try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location ~ ^/api/(?:subskrypcje(?:/(?:potwierdz|wypisz))?|wypisz)$ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host newsletter.aixperts.pl;
        proxy_set_header X-Forwarded-Host newsletter.aixperts.pl;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 25s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location ~ ^/(?:styl\.css|fonty\.css|fonty/[a-zA-Z0-9._-]+\.woff2)$ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host newsletter.aixperts.pl;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cache-Control;
    }
    location / { return 404; }
}
