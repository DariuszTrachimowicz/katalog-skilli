# nginx wewnątrz kontenera `web`. TLS terminuje nginx na hoście (CloudPanel),
# więc tu jest sam HTTP — nagłówki bezpieczeństwa i tak przechodzą do przeglądarki.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Fonty serwujemy lokalnie, więc polityka nie dopuszcza żadnego zewnętrznego hosta.
    add_header Content-Security-Policy   "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 512;

    # Usługa zapisów — dostępna wyłącznie tą drogą, spoza sieci compose nie istnieje.
    location /api/ {
        proxy_pass http://zapisy:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        client_max_body_size 16k;
    }

    # Pliki do pobrania — wymuszamy zapis na dysk zamiast otwierania w oknie.
    location /pobierz/ {
        types { }
        default_type application/zip;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /styl.css { add_header Cache-Control "public, max-age=604800"; }
    location = /fonty.css { add_header Cache-Control "public, max-age=604800"; }
    location /fonty/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /robots.txt { access_log off; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
