# nginx wewnątrz kontenera `web`. TLS terminuje nginx na hoście (CloudPanel),
# więc tu jest sam HTTP — nagłówki bezpieczeństwa i tak przechodzą do przeglądarki.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # TLS terminuje nginx hosta: przekierowania względne, bez schematu http:// z kontenera.
    absolute_redirect off;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Jedyny host poza 'self' to nasza własna subdomena ze statystykami (Umami,
    # ten sam VPS) — żadnych firm trzecich.
    add_header Content-Security-Policy   "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline' https://statystyki.aixperts.pl; img-src 'self' data:; connect-src 'self' https://statystyki.aixperts.pl; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 512;

    # Usługa zapisów — dostępna wyłącznie tą drogą, spoza sieci compose nie istnieje.
    location = /api/crm-zdarzenia {
        proxy_pass http://zapisy:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        client_max_body_size 32k;
    }
    # Potwierdzenia i wypisy zawieraja sekret w URL: nie zapisuj ich w logach.
    location ~ ^/api/subskrypcje(?:/(?:potwierdz|wypisz))?$ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://zapisy:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        client_max_body_size 16k;
    }

    location /api/ {
        proxy_pass http://zapisy:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
        client_max_body_size 16k;
    }

    # Paczki nie są już serwowane statycznie — wydaje je usługa zapisów linkiem
    # z maila (/api/pobierz). Stare bezpośrednie linki kierujemy na stronę skilla.
    location ~ ^/pobierz/(?<skill>[a-z0-9-]+)\.skill$ {
        return 301 /skill/$skill/;
    }

    # Pracownia AiXperts zawieszona decyzją Darka z 4 XI 2026 (do odwołania):
    # strona nie jest budowana, stare adresy prowadzą tymczasowo na katalog.
    location = /pracownia { return 302 /; }
    location ^~ /pracownia/ { return 302 /; }

    # Katalog dla agentów AI (ARD v0.91 i starsza ścieżka ai-catalog) oraz llms.txt:
    # publiczne, statyczne, bez danych osobowych, więc CORS dla każdego.
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        # add_header w lokacji wyłącza dziedziczenie z serwera, więc powtarzamy komplet.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /llms.txt {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        # add_header w lokacji wyłącza dziedziczenie z serwera, więc powtarzamy komplet.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /styl.css { add_header Cache-Control "public, max-age=604800"; }
    location = /fonty.css { add_header Cache-Control "public, max-age=604800"; }
    location /fonty/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /og/ { add_header Cache-Control "public, max-age=86400"; }
    location = /robots.txt { access_log off; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }

    location / {
        # HTML ma byc rewalidowany po wdrozeniu; unikamy starej oferty z cache przegladarki.
        expires -1;
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
